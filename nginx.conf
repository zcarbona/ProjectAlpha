events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;
    server_name _;

    # SSE and real-time events stream configuration
    location /api/events/stream {
      proxy_pass http://api_upstream/api/events/stream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400s;
      chunked_transfer_encoding off;
    }

    # API endpoints
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://api_upstream/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # API health check
    location /api/health {
      proxy_pass http://api_upstream/api/health;
      proxy_set_header Host $host;
    }

    # Next.js Frontend
    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support for Next.js HMR in dev
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
